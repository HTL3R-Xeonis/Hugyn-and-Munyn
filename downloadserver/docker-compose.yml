services:
  filebrowser:
    image: filebrowser/filebrowser
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "4000:80"
    volumes:
      # :rslave - a share that is mounted AFTER the container started (the mount can fail at boot and be retried) shows up inside
      - /mnt/nfsshare:/srv:rslave
      - ./filebrowser.db:/database.db
