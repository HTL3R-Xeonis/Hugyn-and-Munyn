services:
  gns3-template-api:
    build:
      context: .
      dockerfile: gns3_api.Dockerfile
    container_name: gns3-template-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      # Read-only: the API only needs the file the collector produces
      - /home/junioradmin/gns3-reader/data:/data:ro
      # Read-write, but only for the request file that makes the host run the collector now (POST /api/refresh)
      - /home/junioradmin/gns3-reader/trigger:/trigger
