# Template: copy to vmware_exporter_config.local.yml (git-ignored, mode 600) and fill in a read-only monitoring account.
# docker-compose.yml mounts the .local.yml file. Never put real logins in this tracked file.
default:
  vsphere_host: "vcenter.example"
  vsphere_user: "CHANGE_ME"
  vsphere_password: "CHANGE_ME"
  ignore_ssl: true
  specs_size: 5000

  fetch_custom_attributes: false
  fetch_tags: false
  fetch_alarms: true

  collect_only:
    vms: true
    vmguests: true
    hosts: true
    datastores: true
    snapshots: true

esxi8:
