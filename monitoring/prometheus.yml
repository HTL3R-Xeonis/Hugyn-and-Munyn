global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets:
        - '10.20.20.81:9100'
        - '10.20.20.85:9100'
        - '10.20.20.171:9100'
        - '10.20.20.172:9100'
        - '10.20.20.173:9100'
        - '10.20.20.174:9100'
        - '10.20.20.177:9100'
        - '10.20.20.178:9100'
        - '10.20.20.179:9100'
        - '10.20.20.182:9100'

  # Devices that cannot run a node exporter are checked from the outside by the blackbox exporter.
  # Not here on purpose: the ESXi hosts, vCenter and TrueNAS (the vmware_vcenter, vmware_esxi8 and truenas jobs below
  # cover them), the LLM server (its node exporter covers it) and everything of the lab - the GNS3 VM, the lab VMs - because
  # their addresses change.
  # To monitor another one, add a target to the matching job (or a new job) and reload Prometheus:
  #   docker kill -s HUP prometheus
  # Query: probe_success{job=~"probe_.*"} (1 = reachable), probe_duration_seconds, probe_http_status_code.
  - job_name: 'probe_icmp'
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ['10.20.20.90']
        labels:
          name: 'EMC Unisphere storage'
          role: 'storage'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'probe_http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      # the EMC array only speaks a TLS version too old for the exporter ("handshake failure"), its port 80 serves the same page
      - targets: ['http://10.20.20.90/']
        labels:
          name: 'EMC Unisphere storage'
          role: 'storage'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "truenas"
    static_configs:
      - targets:
          - "10.20.20.171:9108"

  - job_name: "vmware_vcenter"
    scrape_interval: 60s
    static_configs:
      - targets:
          - "10.20.20.171:9272"

  - job_name: "vmware_esxi8"
    scrape_interval: 30s
    scrape_timeout: 25s
    metrics_path: /metrics

    params:
      section:
        - esxi8

    static_configs:
      - targets:
          - "10.20.20.171:9272"
        labels:
          environment: "standalone"
