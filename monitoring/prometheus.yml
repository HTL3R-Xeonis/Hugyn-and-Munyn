global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets:
        - '10.20.20.81:9100'
        - '10.20.20.85:9100'
        - '10.20.20.171:9100'
        - '10.20.20.172:9100'
        - '10.20.20.173:9100'
        - '10.20.20.178:9100'

  - job_name: "truenas"
    static_configs:
      - targets:
          - "10.20.20.171:9108"

  - job_name: "vmware_vcenter"
    scrape_interval: 60s
    static_configs:
      - targets:
          - "10.20.20.171:9272"

  - job_name: "vmware_esxi8"
    scrape_interval: 30s
    scrape_timeout: 25s
    metrics_path: /metrics

    params:
      section:
        - esxi8

    static_configs:
      - targets:
          - "10.20.20.171:9272"
        labels:
          environment: "standalone"
