# Configuration for read_gns3_templates.py
#
# For every ESXi host whose GNS3 VM should be read, add an entry under
# 'servers'. The GNS3 VM is looked up fresh via the ESXi API on EVERY run
# (name contains "gns" AND guest OS is Ubuntu Linux (64-bit); backup VMs
# with "-backup-<timestamp>" in the name are excluded) and its current IP
# is read - a hardcoded 'host:' is
# deliberately NO LONGER supported, since a GNS3 VM's IP can change via
# DHCP and a topologybuilder '--fresh-gns3-vm' run creates a completely
# new VM.
# Optionally give 'gns3_vm_name' if more than one VM on a host matches the
# rule above, which would otherwise make auto-detection ambiguous - an
# explicit name is used as-is, without the guest-OS check.
#
# The ESXi password is normally NOT entered here: for a host without an 'esxi_password' of its own the collector asks the
# Operator (OPERATOR_URL + OPERATOR_TOKEN, see .env.example). There is no process-wide ESXi password any more.
#
# 'username'/'password' (without the esxi_ prefix) are something different:
# these are optional and only needed if "Enable HTTP authentication" is
# enabled on the GNS3 server ITSELF (not ESXi) - otherwise just omit them.

# Instead of listing the hosts here, the collector can take them from the host profiles of Igdrasyl (formerly TopologyOperator, part of Ginnungagap):
#   read_gns3_templates.py --config gns3_config.yml --profiles-dir <its settings_profiles folder>
# (or set HOST_PROFILES_DIR). Then 'servers' below is not used; each profile with an esxi.ip becomes a server named after
# the profile, with the ESXi password the app stored for that host (else the Operator is asked). output_file, log_file and
# request_timeout are still read from here.

servers:
  - name: gns3-server-2
    esxi_host: 10.20.20.202
    esxi_username: root
    port: 80
    # gns3_vm_name: GNS3-VM

# Where to write the combined output to
output_file: /home/junioradmin/gns3-reader/data/gns3_templates.yml

# Where to log to
log_file: /home/junioradmin/gns3-reader/logs/read_gns3.log

# Timeout per HTTP request in seconds
request_timeout: 15
